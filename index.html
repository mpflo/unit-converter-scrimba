<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Unit Converter</title>
</head>
<body class="flex h-screen justify-center items-center my-2">
    <section class="w-[90%] md:w-[40%]">
        <div class="bg-[#6943FF] text-center py-8 text-white">
            <h1 class="text-[24px] md:text-[28px] font-extrabold">Metric/Imperial Unit Conversion</h1>
            <div>
                <input class="border-2 border-[#B295FF] rounded-[5px] w-29.25 h-20.75 text-[60px] font-extrabold text-center my-6" type="text" id="num-input">
                <button class="block text-center mx-auto bg-white text-[#3D3D3D] py-2 px-7 text-[18px] rounded-[5px]" id="btn-convert">Convert</button>
            </div>
        </div>

        <div class="bg-[#F4F4F4] p-7">
            <div class="bg-white text-center p-5 rounded-[5px]">
                <h2 class="text-[20px] font-semibold text-[#5A537B] mb-2">Length (Meter/Feet)</h2>
                <p class="text-[#353535]" id="length"></p>
            </div>
            <div class="bg-white my-4 text-center p-5 rounded-[5px]">
                <h2 class="text-[20px] font-semibold text-[#5A537B] mb-2">Volume (Liters/Gallons)</h2>
                <p class="text-[#353535]" id="volume"></p>
            </div>
            <div class="bg-white text-center p-5 rounded-[5px]">
                <h2 class="text-[20px] font-semibold text-[#5A537B] mb-2">Mass (Kilograms/Pounds)</h2>
                <p class="text-[#353535]" id="mass"></p>
            </div>
        </div>
    </section>
    <script src="index.js"></script>
</body>
</html>
